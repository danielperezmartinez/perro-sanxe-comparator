name: Seguridad

# Comprobaciones del sistema "Seguridad, coste y cumplimiento" (docs/README.md).
# No son obligatorias en la protección de rama hasta que estén en verde: la
# base actual falla a propósito en los hallazgos registrados como tareas.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls:
    name: Tests RLS y catálogo (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase test db

  a11y:
    name: Accesibilidad (AXE) y secretos en el bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Habilitar pnpm (Corepack)
        run: corepack enable

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Busca claves reales, no el texto "sb_secret_" que supabase-js incluye para
      # reconocer el prefijo: una secret key (sb_secret_ + token) o un JWT cuyo
      # payload lleve "role":"service_role" (sus tres alineaciones en base64).
      - name: Ninguna clave secreta en el bundle
        run: >-
          ! grep -rIoE
          "sb_secret_[A-Za-z0-9_-]{16,}|InJvbGUiOiJzZXJ2aWNlX3Jv|b2xlIjoic2VydmljZV9yb2xl|cm9sZSI6InNlcnZpY2Vfcm9s"
          dist/perro-sanxe-comparator

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y

  fugas:
    name: Fugas (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Solo patrones genéricos (.gitleaks.toml): los personales no se suben ni
      # como secreto de CI. Falsos positivos documentados en .gitleaksignore.
      - name: gitleaks (historial, mensajes, rama y PR)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          # El texto del PR va por variable de entorno, nunca interpolado en el script.
          PR_TEXTO: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml
          { git log --format=%B; printf '%s\n%s\n' "$RAMA" "$PR_TEXTO"; } | ./gitleaks stdin --redact --no-banner --config .gitleaks.toml
