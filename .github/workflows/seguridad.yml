name: Seguridad

# Comprobaciones del sistema "Seguridad, coste y cumplimiento" (docs/README.md).
# Publicación: sección "Publicación" de docs/README.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguridad-${{ github.event.pull_request.number || github.ref }}
  # En main no se cancela: un push de la bóveda no debe interrumpir el CI de una
  # integración de código.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detecta si hay cambios fuera de docs/. Los jobs rls y a11y se omiten si no los
  # hay (un check omitido cuenta como superado); fugas corre siempre.
  cambios:
    name: Cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codigo: ${{ steps.diff.outputs.codigo }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        # Si el diff no se puede calcular (p. ej. workflow_dispatch), se trata como código.
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- . ':(exclude)docs' 2>/dev/null; then
            echo "codigo=false" >> "$GITHUB_OUTPUT"
          else
            echo "codigo=true" >> "$GITHUB_OUTPUT"
          fi

  rls:
    name: Tests RLS y catálogo (pgTAP)
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - run: supabase db start
      - run: supabase test db

  a11y:
    name: Accesibilidad (AXE) y secretos en el bundle
    needs: cambios
    if: needs.cambios.outputs.codigo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Publicación: cada PR de código sube la versión por encima de la de main.
      - name: La versión supera la de main
        if: github.event_name == 'pull_request'
        run: sh scripts/comprobar-version.sh "${{ github.event.pull_request.base.sha }}"

      - name: Habilitar pnpm (Corepack)
        run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Busca claves reales, no el texto "sb_secret_" que supabase-js incluye para
      # reconocer el prefijo: una secret key (sb_secret_ + token) o un JWT cuyo
      # payload lleve "role":"service_role" (sus tres alineaciones en base64).
      - name: Ninguna clave secreta en el bundle
        run: >-
          ! grep -rIoE
          "sb_secret_[A-Za-z0-9_-]{16,}|InJvbGUiOiJzZXJ2aWNlX3Jv|b2xlIjoic2VydmljZV9yb2xl|cm9sZSI6InNlcnZpY2Vfcm9s"
          dist/perro-sanxe-comparator

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y

  fugas:
    name: Fugas (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Solo patrones genéricos (.gitleaks.toml): los personales no se suben ni
      # como secreto de CI. Falsos positivos documentados en .gitleaksignore.
      - name: gitleaks (historial, mensajes, rama y PR)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          # El texto del PR va por variable de entorno, nunca interpolado en el script.
          PR_TEXTO: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          curl -sSfLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml
          { git log --format=%B; printf '%s\n%s\n' "$RAMA" "$PR_TEXTO"; } | ./gitleaks stdin --redact --no-banner --config .gitleaks.toml
